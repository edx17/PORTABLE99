name: Compilar exe para Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Compilar
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name UnificadorPDF UnificadorPDF.py
      - name: Prueba rápida del núcleo
        run: python -c "from unificador import core; print('ok')"
      - uses: actions/upload-artifact@v4
        with:
          name: UnificadorPDF-windows
          path: dist/UnificadorPDF.exe
      - name: Publicar release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/UnificadorPDF.exe
